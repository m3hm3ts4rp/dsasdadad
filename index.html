<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özür Dilerim</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background-color: #ffffff;
            overflow: hidden;
        }
        .text-link {
            font-size: 1.5rem;
            color: #000000;
            cursor: pointer;
            user-select: none;
            /* Sürekli hareket etmesini sağlayan animasyon */
            animation: hareketEt 3s ease-in-out infinite; 
        }
        
        /* Sağa-sola ve yukarı-aşağı yumuşak hareket animasyonu */
        @keyframes hareketEt {
            0% { transform: translate(0, 0); }
            25% { transform: translate(15px, -10px); }
            50% { transform: translate(-10px, 15px); }
            75% { transform: translate(-15px, -5px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div class="text-link" id="yazi" onclick="degistir()">
        Özür dilerim, kabul ediyor musun?
    </div>

    <script>
        function degistir() {
            document.getElementById("yazi").innerText = "Teşekkürler";
        }
    </script>

</body>
</html>
